<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#be123c">
  <meta name="description" content="Bienvenido a Amari. Encuentra asistencia para tu vehículo de forma fácil y rápida.">
  <title>Amari | Bienvenido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --red: #e11d48;
      --red-hover: #be123c;
      --red-dark: #881337;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --paper: #fff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--ink);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { min-width: 320px; min-height: 100%; }
    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background: var(--paper);
    }
    button, a { font: inherit; }
    .app-screen {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fffdfd;
    }
    .hero {
      position: relative;
      min-height: 390px;
      flex: 1 0 55%;
      overflow: hidden;
      padding: max(34px, env(safe-area-inset-top)) 28px 76px;
      color: var(--paper);
      background: linear-gradient(150deg, #f43f5e 0%, var(--red) 48%, var(--red-dark) 100%);
    }
    .hero::before, .hero::after {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 50%;
      content: '';
      pointer-events: none;
    }
    .hero::before {
      top: -126px;
      right: -118px;
      width: 310px;
      height: 310px;
      box-shadow: 0 0 0 34px rgba(255, 255, 255, .035), 0 0 0 72px rgba(255, 255, 255, .025);
    }
    .hero::after {
      right: 28px;
      bottom: 4px;
      width: 90px;
      height: 90px;
      background: rgba(255, 255, 255, .045);
    }
    .brand {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--paper);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 2px;
      text-decoration: none;
    }
    .brand img {
      display: block;
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, .9);
      border-radius: 15px;
      object-fit: cover;
      box-shadow: 0 7px 18px rgba(91, 7, 30, .2);
    }
    .hero-copy {
      position: relative;
      z-index: 1;
      max-width: 360px;
      margin-top: clamp(54px, 12vh, 106px);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 17px;
      color: rgba(255, 255, 255, .82);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .eyebrow::before {
      width: 19px;
      height: 2px;
      content: '';
      background: #fecdd3;
    }
    h1 {
      margin: 0;
      font-size: clamp(39px, 11vw, 52px);
      font-weight: 800;
      letter-spacing: -2.4px;
      line-height: 1.08;
    }
    h1 span { color: #fecdd3; }
    .hero-copy p {
      max-width: 320px;
      margin: 16px 0 0;
      color: rgba(255, 255, 255, .84);
      font-size: 14px;
      line-height: 1.7;
    }
    .welcome-panel {
      position: relative;
      z-index: 2;
      width: 100%;
      margin-top: -34px;
      padding: 31px 24px max(24px, env(safe-area-inset-bottom));
      border-radius: 30px 30px 0 0;
      background: #fffdfd;
      box-shadow: 0 -12px 35px rgba(99, 12, 38, .08);
    }
    .panel-handle {
      width: 38px;
      height: 4px;
      margin: -12px auto 24px;
      border-radius: 99px;
      background: #e2e8f0;
    }
    .welcome-panel h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.5px;
    }
    .welcome-panel > p {
      margin: 7px 0 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .actions { display: grid; gap: 11px; }
    .button {
      width: 100%;
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 20px;
      border: 1px solid transparent;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .button:focus-visible, .brand:focus-visible {
      outline: 3px solid rgba(225, 29, 72, .35);
      outline-offset: 3px;
    }
    .button:active { transform: scale(.985); }
    .button-primary {
      color: var(--paper);
      background: linear-gradient(135deg, var(--red), var(--red-hover));
      box-shadow: 0 9px 19px rgba(225, 29, 72, .22);
    }
    .button-primary:hover { box-shadow: 0 12px 24px rgba(225, 29, 72, .3); }
    .button-secondary {
      color: var(--red-dark);
      border-color: #fecdd3;
      background: var(--paper);
    }
    .button-secondary:hover { border-color: #fda4af; background: #fff7f8; }
    .terms {
      margin: 18px 0 0;
      color: #94a3b8;
      font-size: 10px;
      line-height: 1.6;
      text-align: center;
    }
    @media (min-width: 600px) {
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 20%, rgba(225, 29, 72, .08), transparent 22rem),
          #f1f5f9;
      }
      .app-screen {
        width: min(100%, 430px);
        min-height: min(880px, calc(100vh - 48px));
        min-height: min(880px, calc(100svh - 48px));
        border: 1px solid rgba(226, 232, 240, .85);
        border-radius: 30px;
        box-shadow: 0 30px 90px rgba(15, 23, 42, .16);
      }
      .hero { padding-right: 34px; padding-left: 34px; }
      .welcome-panel { padding-right: 32px; padding-left: 32px; }
    }
    @media (max-height: 700px) and (max-width: 599px) {
      .hero { min-height: 340px; padding-top: max(22px, env(safe-area-inset-top)); }
      .hero-copy { margin-top: 38px; }
      .welcome-panel { padding-top: 26px; }
      .welcome-panel > p { margin-bottom: 16px; }
      .terms { margin-top: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-screen">
    <main class="hero">
      <a class="brand" href="index.html" aria-label="Amari, inicio">
        <img src="assets/logoamari.png" alt="">
        <span>AMARI</span>
      </a>
      <section class="hero-copy" aria-labelledby="welcome-title">
        <div class="eyebrow">Asistencia para tu camino</div>
        <h1 id="welcome-title">Tu vehículo,<br>en <span>buenas manos.</span></h1>
        <p>Estamos aquí para ayudarte a encontrar el apoyo que tu vehículo necesita.</p>
      </section>
    </main>

    <section class="welcome-panel" aria-labelledby="account-title">
      <div class="panel-handle" aria-hidden="true"></div>
      <h2 id="account-title">Bienvenido a Amari</h2>
      <p>Continúa para empezar a recibir asistencia cerca de ti.</p>
      <div class="actions">
        <a class="button button-primary" href="register.html">
          Crear una cuenta
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path>
          </svg>
        </a>
        <a class="button button-secondary" href="login.html">Iniciar sesión</a>
      </div>
      <p class="terms">Tu camino, con más tranquilidad.</p>
    </section>
  </div>
</body>
</html>
