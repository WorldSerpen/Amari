<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf9">
  <meta name="description" content="Visualiza tu ubicación en el mapa de Amari.">
  <title>Mi ubicación | Amari</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-red: #e11d48;
      --primary-red-hover: #be123c;
      --primary-red-dark: #881337;
      --primary-red-light: #ffe4e6;
      --primary-red-glow: rgba(225, 29, 72, 0.25);
      --red-accent: #f43f5e;
      --pure-white: #ffffff;
      --off-white: #f8fafc;
      --surface-white: #ffffff;
      --border-light: #f1f5f9;
      --border-medium: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --success-green: #10b981;
      --shadow-subtle: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-card: 0 20px 40px -15px rgba(225, 29, 72, 0.08), 0 0 20px 0 rgba(0, 0, 0, 0.04);
      --shadow-glow: 0 10px 25px -5px rgba(225, 29, 72, 0.35);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text-main);
      background: var(--off-white);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      background:
        radial-gradient(circle at 12% 18%, rgba(225, 29, 72, 0.07), transparent 28rem),
        var(--off-white);
    }

    button, a {
      font: inherit;
    }

    .app-shell {
      position: relative;
      width: min(100%, 520px);
      height: min(940px, 100vh);
      height: min(940px, 100dvh);
      overflow: hidden;
      isolation: isolate;
      background: var(--off-white);
    }

    .map-stage {
      position: absolute;
      inset: 0;
    }

    .map-stage {
      container-type: size;
    }

    .map-preview {
      position: absolute;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background: #e9eef0;
    }

    .mechanic-markers {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      width: min(100%, 56.470588dvh);
      aspect-ratio: 768 / 1360;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    @supports (width: 1cqh) {
      .mechanic-markers {
        width: min(100cqw, 56.470588cqh);
      }
    }

    .mechanic-marker {
      position: absolute;
      display: grid;
      width: clamp(28px, 5.73%, 56px);
      aspect-ratio: 1;
      padding: 0;
      place-items: center;
      transform: translate(-50%, -50%);
      border: 3px solid var(--pure-white);
      border-radius: 50%;
      background: var(--primary-red);
      box-shadow: 0 3px 12px rgba(136, 19, 55, 0.4);
      color: var(--pure-white);
      cursor: pointer;
      pointer-events: auto;
      transition: transform 160ms ease, background-color 160ms ease;
    }

    .mechanic-marker:hover,
    .mechanic-marker[aria-pressed="true"] {
      transform: translate(-50%, -50%) scale(1.1);
      background: var(--primary-red-hover);
    }

    .mechanic-marker:focus-visible {
      outline: 3px solid var(--pure-white);
      outline-offset: 3px;
    }

    .mechanic-marker svg {
      width: 55%;
      height: 55%;
    }

    .mechanic-confirmation {
      width: min(420px, calc(100% - 32px));
      max-width: none;
      padding: 28px;
      border: 1px solid var(--border-medium);
      border-radius: 24px;
      background: var(--pure-white);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.24);
      color: var(--text-main);
      text-align: center;
    }

    .mechanic-confirmation::backdrop {
      background: rgba(15, 23, 42, 0.48);
      backdrop-filter: blur(3px);
    }

    .mechanic-confirmation-icon {
      display: grid;
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      place-items: center;
      border-radius: 18px;
      background: var(--primary-red-light);
      color: var(--primary-red);
    }

    .mechanic-confirmation-icon svg {
      width: 27px;
      height: 27px;
    }

    .mechanic-confirmation-title {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .mechanic-confirmation-copy {
      margin: 8px 0 24px;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .mechanic-confirmation-actions {
      display: flex;
      flex-direction: column-reverse;
      gap: 10px;
    }

    .mechanic-confirmation-button {
      min-height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
    }

    .mechanic-confirmation-button:focus-visible {
      outline: 3px solid var(--primary-red-glow);
      outline-offset: 3px;
    }

    .mechanic-confirmation-button--confirm {
      background: linear-gradient(135deg, var(--primary-red), var(--primary-red-hover));
      box-shadow: var(--shadow-glow);
      color: var(--pure-white);
    }

    .mechanic-confirmation-button--cancel {
      border: 1px solid var(--border-medium);
      background: var(--pure-white);
      color: var(--text-main);
    }

    @media (min-width: 480px) {
      .mechanic-confirmation-actions {
        flex-direction: row;
        justify-content: center;
      }

      .mechanic-confirmation-button {
        min-width: 140px;
      }
    }

    .top-bar {
      position: absolute;
      z-index: 500;
      top: 0;
      right: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: max(16px, env(safe-area-inset-top)) 18px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.78);
      background: rgba(255, 255, 255, 0.62);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
      backdrop-filter: blur(14px);
      pointer-events: none;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 6px 15px 6px 7px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--shadow-card);
      color: var(--primary-red);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.4px;
      text-decoration: none;
      pointer-events: auto;
      backdrop-filter: blur(12px);
    }

    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--primary-red), var(--red-accent));
      box-shadow: 0 4px 10px var(--primary-red-glow);
      color: var(--pure-white);
      font-size: 1.1rem;
      font-weight: 900;
    }

    .page-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 42px;
      padding: 0 13px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--shadow-subtle);
      color: var(--text-main);
      font-size: 0.82rem;
      font-weight: 700;
      pointer-events: auto;
      backdrop-filter: blur(12px);
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
    }

    .page-label:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-card);
    }

    .page-label:active {
      transform: scale(0.96);
      background: var(--primary-red-light);
      box-shadow: var(--shadow-subtle);
    }

    .page-label:focus-visible {
      outline: 3px solid var(--primary-red-glow);
      outline-offset: 3px;
    }

    .page-label svg {
      width: 17px;
      height: 17px;
      color: var(--primary-red);
    }

    .brand:focus-visible {
      outline: 3px solid var(--primary-red-glow);
      outline-offset: 3px;
    }

    .location-card {
      position: absolute;
      z-index: 500;
      right: 14px;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 14px;
      padding: 20px 18px 16px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(16px);
    }

    .card-heading {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .location-card-toggle {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      margin-left: auto;
      place-items: center;
      border: 1px solid var(--border-medium);
      border-radius: 12px;
      background: var(--pure-white);
      color: var(--text-main);
      cursor: pointer;
    }

    .location-card-toggle:hover {
      border-color: var(--primary-red);
      color: var(--primary-red);
    }

    .location-card-toggle:focus-visible {
      outline: 3px solid var(--primary-red-glow);
      outline-offset: 2px;
    }

    .location-card-toggle svg {
      width: 18px;
      height: 18px;
      transition: transform 180ms ease;
    }

    .location-card.is-collapsed .card-heading {
      align-items: center;
      margin-bottom: 0;
    }

    .location-card.is-collapsed .location-card-toggle svg {
      transform: rotate(180deg);
    }

    .location-card-content[hidden] {
      display: none;
    }

    .location-icon {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 14px;
      background: var(--primary-red-light);
      color: var(--primary-red);
    }

    .location-icon svg {
      width: 21px;
      height: 21px;
    }

    .card-copy {
      min-width: 0;
      padding-top: 1px;
    }

    .card-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .location-status {
      margin: 4px 0 0;
      color: var(--text-muted);
      font-size: 0.8rem;
      line-height: 1.45;
    }

    .location-status[data-state="success"] {
      color: #047857;
    }

    .location-status[data-state="error"] {
      color: var(--primary-red-hover);
    }

    .location-search {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-bottom: 10px;
    }

    .location-search input {
      min-width: 0;
      min-height: 48px;
      padding: 0 13px;
      border: 1px solid var(--border-medium);
      border-radius: 14px;
      background: var(--pure-white);
      color: var(--text-main);
      font: inherit;
      font-size: 0.85rem;
    }

    .location-search input:focus-visible,
    .search-button:focus-visible,
    .search-recommendation:focus-visible,
    .search-result:focus-visible {
      outline: 3px solid var(--primary-red-glow);
      outline-offset: 2px;
    }

    .search-button {
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid var(--border-medium);
      border-radius: 14px;
      background: var(--pure-white);
      color: var(--text-main);
      font: inherit;
      font-size: 0.83rem;
      font-weight: 700;
      cursor: pointer;
    }

    .search-button {
      border-color: var(--primary-red);
      background: var(--primary-red);
      color: var(--pure-white);
    }

    .search-button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .recommendations-label {
      margin: 0 0 7px;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .search-recommendations {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .search-recommendation {
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid var(--border-medium);
      border-radius: 999px;
      background: var(--pure-white);
      color: var(--text-main);
      font: inherit;
      font-size: 0.7rem;
      cursor: pointer;
    }

    .location-results {
      display: grid;
      max-height: 108px;
      gap: 6px;
      overflow-y: auto;
      margin: 0 0 10px;
      padding: 0;
      list-style: none;
    }

    .location-results[hidden] {
      display: none;
    }

    .search-result {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      background: var(--off-white);
      color: var(--text-main);
      font: inherit;
      font-size: 0.76rem;
      line-height: 1.4;
      text-align: left;
      cursor: pointer;
    }

    .privacy-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin: 12px 0 0;
      color: var(--text-light);
      font-size: 0.68rem;
      text-align: center;
    }

    .privacy-note svg {
      width: 13px;
      height: 13px;
      flex: 0 0 auto;
    }

    @media (min-width: 600px) {
      .app-shell {
        height: min(900px, calc(100dvh - 48px));
        border: 8px solid var(--pure-white);
        border-radius: 34px;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.16);
      }

      .top-bar {
        padding: 20px 18px 12px;
      }

      .location-card {
        right: 18px;
        bottom: 18px;
        left: 18px;
        padding: 22px 20px 17px;
      }
    }

    @media (min-width: 768px) {
      body {
        display: block;
      }

      .app-shell {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(24px, 4vw, 56px);
        padding: 0 clamp(24px, 4vw, 64px);
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .top-bar {
        padding: max(24px, env(safe-area-inset-top)) clamp(24px, 4vw, 64px) 14px;
      }

      .map-stage {
        position: relative;
        inset: auto;
        flex: 0 1 min(56.470588dvh, 42vw);
        width: min(56.470588dvh, 42vw);
        aspect-ratio: 768 / 1360;
      }

      .location-card {
        position: relative;
        inset: auto;
        flex: 0 1 390px;
        width: min(390px, 35vw);
        min-width: 320px;
        margin: 0;
        padding: 22px 20px 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell" aria-label="Mapa de Amari">
    <section class="map-stage" aria-label="Mapa de referencia">
      <img
        class="map-preview"
        src="assets/LocationImage.jpg"
        alt="Vista de referencia del mapa en la zona de la Universidad de Colima"
      >
      <div class="mechanic-markers" aria-label="Mecánicos en el mapa">
        <button class="mechanic-marker" type="button" style="left: 43.49%; top: 29.41%;" aria-label="Seleccionar mecánico 1" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 14.5 4.5 9h15l1.5 5.5v4h-2v-2H5v2H3v-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="m6 9 1.5-3h9L18 9M6 12h3m6 0h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="mechanic-marker" type="button" style="left: 93.88%; top: 20.37%;" aria-label="Seleccionar mecánico 2" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 14.5 4.5 9h15l1.5 5.5v4h-2v-2H5v2H3v-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="m6 9 1.5-3h9L18 9M6 12h3m6 0h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="mechanic-marker" type="button" style="left: 47.27%; top: 68.01%;" aria-label="Seleccionar mecánico 3" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 14.5 4.5 9h15l1.5 5.5v4h-2v-2H5v2H3v-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="m6 9 1.5-3h9L18 9M6 12h3m6 0h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="mechanic-marker" type="button" style="left: 66.02%; top: 68.16%;" aria-label="Seleccionar mecánico 4" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 14.5 4.5 9h15l1.5 5.5v4h-2v-2H5v2H3v-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="m6 9 1.5-3h9L18 9M6 12h3m6 0h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </section>

    <header class="top-bar">
      <a class="brand" href="home.html" aria-label="Amari, ir al inicio">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span>amari</span>
      </a>
      <button class="page-label" type="button" aria-label="Mi ubicación">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        Mi ubicación
      </button>
    </header>

    <section class="location-card" aria-labelledby="location-title">
      <div class="card-heading">
        <span class="location-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </span>
        <div class="card-copy">
          <h1 class="card-title" id="location-title">Encuentra tu ubicación</h1>
          <p class="location-status" id="location-status" role="status" aria-live="polite">
            Escribe una dirección o elige una sugerencia para buscarla.
          </p>
        </div>
        <button
          class="location-card-toggle"
          id="location-card-toggle"
          type="button"
          aria-expanded="true"
          aria-controls="location-card-content"
          aria-label="Contraer búsqueda"
          title="Contraer búsqueda"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="location-card-content" id="location-card-content">
        <form class="location-search" id="location-search-form" role="search">
        <input
          id="location-search-input"
          type="search"
          placeholder="Busca una dirección o lugar"
          aria-label="Dirección o lugar para buscar"
          autocomplete="street-address"
          required
        >
        <button class="search-button" id="search-location-button" type="submit">Buscar</button>
        </form>
        <ul class="location-results" id="location-results" aria-label="Resultados de búsqueda" hidden></ul>
        <p class="recommendations-label">Búsquedas sugeridas</p>
        <div class="search-recommendations" aria-label="Ejemplos de búsqueda">
          <button class="search-recommendation" type="button">Universidad de Colima</button>
          <button class="search-recommendation" type="button">Centro de Colima</button>
          <button class="search-recommendation" type="button">Plaza Zentralia</button>
        </div>
        <p class="privacy-note">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="10" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.7"/>
            <path d="M8 10V7a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          No necesitas compartir la ubicación de tu dispositivo.
        </p>
      </div>
    </section>
  </main>

  <dialog class="mechanic-confirmation" id="mechanic-confirmation" aria-labelledby="mechanic-confirmation-title" aria-describedby="mechanic-confirmation-copy">
    <span class="mechanic-confirmation-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </span>
    <h2 class="mechanic-confirmation-title" id="mechanic-confirmation-title">Confirmar mecánico</h2>
    <p class="mechanic-confirmation-copy" id="mechanic-confirmation-copy">¿Confirmas la selección de este mecánico?</p>
    <div class="mechanic-confirmation-actions">
      <button class="mechanic-confirmation-button mechanic-confirmation-button--cancel" id="cancel-mechanic-button" type="button">
        Cancelar
      </button>
      <button class="mechanic-confirmation-button mechanic-confirmation-button--confirm" id="confirm-mechanic-button" type="button" autofocus>
        Confirmar
      </button>
    </div>
  </dialog>

  <script>
    const mechanicMarkers = [...document.querySelectorAll('.mechanic-marker')];
    const mechanicConfirmation = document.getElementById('mechanic-confirmation');
    const confirmMechanicButton = document.getElementById('confirm-mechanic-button');
    const cancelMechanicButton = document.getElementById('cancel-mechanic-button');
    let selectedMechanic;

    mechanicMarkers.forEach((marker) => {
      marker.addEventListener('click', () => {
        selectedMechanic = marker;
        mechanicMarkers.forEach((item) => item.setAttribute('aria-pressed', String(item === marker)));
        mechanicConfirmation.showModal();
      });
    });

    confirmMechanicButton.addEventListener('click', () => {
      mechanicConfirmation.close('confirmed');
    });

    cancelMechanicButton.addEventListener('click', () => {
      mechanicConfirmation.close('cancelled');
    });

    mechanicConfirmation.addEventListener('click', (event) => {
      if (event.target === mechanicConfirmation) mechanicConfirmation.close('cancelled');
    });

    mechanicConfirmation.addEventListener('close', () => {
      if (mechanicConfirmation.returnValue !== 'confirmed') {
        selectedMechanic?.setAttribute('aria-pressed', 'false');
      }
      selectedMechanic?.focus();
      selectedMechanic = undefined;
    });

  </script>

  <script>
    const status = document.getElementById('location-status');
    const searchForm = document.getElementById('location-search-form');
    const searchInput = document.getElementById('location-search-input');
    const searchButton = document.getElementById('search-location-button');
    const searchResults = document.getElementById('location-results');
    const searchRecommendations = [...document.querySelectorAll('.search-recommendation')];
    const locationCard = document.querySelector('.location-card');
    const locationCardToggle = document.getElementById('location-card-toggle');
    const locationCardContent = document.getElementById('location-card-content');

    function setLocationCardExpanded(isExpanded) {
      locationCardToggle.setAttribute('aria-expanded', String(isExpanded));
      locationCardToggle.setAttribute('aria-label', isExpanded ? 'Contraer búsqueda' : 'Expandir búsqueda');
      locationCardToggle.title = isExpanded ? 'Contraer búsqueda' : 'Expandir búsqueda';
      locationCardContent.hidden = !isExpanded;
      locationCard.classList.toggle('is-collapsed', !isExpanded);
    }

    locationCardToggle.addEventListener('click', () => {
      const isExpanded = locationCardToggle.getAttribute('aria-expanded') === 'true';
      setLocationCardExpanded(!isExpanded);
    });

    function setStatus(message, state = 'default') {
      status.textContent = message;
      status.dataset.state = state;
    }

    searchForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const query = searchInput.value.trim();
      if (!query) {
        searchInput.focus();
        return;
      }

      searchButton.disabled = true;
      searchResults.replaceChildren();
      searchResults.hidden = true;
      setStatus('Buscando lugares…');

      try {
        const parameters = new URLSearchParams({
          q: query,
          format: 'jsonv2',
          limit: '5'
        });
        const response = await fetch(`https://nominatim.openstreetmap.org/search?${parameters}`);
        if (!response.ok) throw new Error(`La búsqueda respondió con el estado ${response.status}.`);

        const results = await response.json();
        const places = Array.isArray(results) ? results.filter((place) => {
          const latitude = Number(place.lat);
          const longitude = Number(place.lon);
          return Number.isFinite(latitude) && Number.isFinite(longitude) && place.display_name;
        }) : [];

        if (places.length === 0) {
          setStatus('No encontramos lugares con esa búsqueda. Prueba con otra dirección.', 'error');
          return;
        }

        places.forEach((place) => {
          const item = document.createElement('li');
          const button = document.createElement('button');
          button.className = 'search-result';
          button.type = 'button';
          button.textContent = place.display_name;
          button.addEventListener('click', () => {
            searchResults.hidden = true;
            searchInput.value = place.display_name;
            setStatus(`Ubicación encontrada: ${place.display_name}`, 'success');
          });
          item.append(button);
          searchResults.append(item);
        });

        searchResults.hidden = false;
        setStatus(`Selecciona una de las ${places.length} ubicaciones encontradas.`);
      } catch (error) {
        console.error('No se pudo buscar la dirección:', error);
        setStatus('No pudimos completar la búsqueda. Comprueba tu conexión e inténtalo de nuevo.', 'error');
      } finally {
        searchButton.disabled = false;
      }
    });

    searchRecommendations.forEach((recommendation) => {
      recommendation.addEventListener('click', () => {
        searchInput.value = recommendation.textContent.trim();
        searchForm.requestSubmit();
      });
    });
  </script>
</body>
</html>
